backends:
  ssh-terminal:
    connect_timeout_seconds: 15
    default_quiet_timeout_ms: 1000
    default_deadline_ms: 15000
    default_response_limit_bytes: 200000
    max_sessions: 10
    session_idle_ttl_seconds: 600
    max_session_lifetime_seconds: 3600
  ssh-exec:
    connect_timeout_seconds: 15
    default_command_timeout_seconds: 60
  http:
    connect_timeout_seconds: 10
    default_request_timeout_seconds: 30
    max_response_bytes: 2000000

accounts:
  password-operator:
    username: netadmin
    password: plaintext-password

  key-operator:
    username: root
    private_key: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      ...
      -----END OPENSSH PRIVATE KEY-----

  web-operator:
    username: webadmin
    password: plaintext-password

  password-only-web-operator:
    password: plaintext-password

devices:
  example-huawei:
    type: ssh-terminal
    host: 192.0.2.10
    port: 22
    account: password-operator

  example-openwrt:
    type: ssh-exec
    host: 192.0.2.20
    port: 22
    account: key-operator

  example-tplink-switch:
    type: http-tplink-switch
    host: 192.0.2.30
    account: web-operator

  example-zte-be7200:
    type: http-zte-be7200
    host: 192.0.2.40
    account: password-only-web-operator

  example-mellanox-onyx:
    type: http-mellanox-onyx
    host: 192.0.2.50
    account: web-operator
    verify_tls: false
